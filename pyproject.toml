[project]
name = "google-drive-scan-renamer"
version = "0.1.0"
description = "Scan Google Drive documents and rename them via an LLM (OpenAI) + the Drive API. Runs primarily in Docker; this uv env is for local dev / one-time OAuth setup (see README)."
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "pypdf>=5.0.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[project.scripts]
gds-auth = "auth_setup:main"
gds-scan = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["auth_setup.py", "app"]
