[project]
name = "google-drive-scan-renamer"
version = "0.2.0"
description = "ScanSnap processor: OCR scans dropped into a Google Drive folder, then have an LLM name each one and write a structured .md sidecar. The batch itself runs in Docker (scripts/run.sh); this uv env is for local dev and the host-side helpers."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "pypdf>=5.0.0",
    "PyYAML>=6.0",
]
